name: Deploy SkillBridge to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Require the deployed API URL
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "Set the GitHub Actions repository variable VITE_API_URL to the deployed Firebase function URL."
            exit 1
          fi
          node -e "const url = new URL(process.env.VITE_API_URL); if (url.protocol !== 'https:' || !url.hostname.endsWith('.cloudfunctions.net')) process.exit(1)"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build for project Pages path
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          repository="${GITHUB_REPOSITORY#*/}"
          owner="${GITHUB_REPOSITORY%%/*}"
          if [ "$repository" = "$owner.github.io" ]; then
            base_path="/"
          else
            base_path="/$repository/"
          fi
          echo "VITE_BASE_PATH=$base_path" >> "$GITHUB_ENV"
          export VITE_BASE_PATH="$base_path"
          npm run build

      - name: Add GitHub Pages SPA fallback
        run: |
          cp frontend/dist/index.html frontend/dist/404.html
          touch frontend/dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
