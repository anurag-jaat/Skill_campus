<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="sb-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="60%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="sb-arch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#99f6e4"/>
    </linearGradient>
    <linearGradient id="sb-deck" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="sb-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Modern Rounded Squircle Container -->
  <rect width="64" height="64" rx="18" fill="url(#sb-bg)"/>
  
  <!-- Subtle High-Tech Glass Border -->
  <rect x="1" y="1" width="62" height="62" rx="17" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>

  <!-- Bridge Iconography -->
  <!-- Suspension Arch Curve (Upper Bridge Span) -->
  <path d="M14 42 C 20 22, 44 22, 50 42" stroke="url(#sb-arch)" stroke-width="4.5" stroke-linecap="round" fill="none" filter="url(#sb-glow)"/>
  
  <!-- Bridge Deck / Horizontal Transit Span -->
  <path d="M12 42 H 52" stroke="url(#sb-deck)" stroke-width="4" stroke-linecap="round"/>

  <!-- Suspension Cables (Connecting Pillars) -->
  <path d="M22 42 V 30" stroke="#ffffff" stroke-opacity="0.8" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M32 42 V 25" stroke="#ffffff" stroke-opacity="0.95" stroke-width="3" stroke-linecap="round"/>
  <path d="M42 42 V 30" stroke="#ffffff" stroke-opacity="0.8" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Upper Synergy Spark / Peer Exchange Node -->
  <circle cx="32" cy="18" r="3.5" fill="#ffffff" filter="url(#sb-glow)"/>
  <circle cx="32" cy="18" r="1.5" fill="#0f766e"/>
</svg>
